defaults:
  - env/libero_10@env.train
  - env/libero_10@env.eval
  - model/openvla_oft@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 2,3

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "debug_10"
    logger_backends: ["wandb"] # wandb, swanlab

  max_epochs: 2
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 25
  # After each successful save, remove the previous checkpoint's actor/dcp_checkpoint (saves disk; old steps lose full FSDP resume).
  prune_previous_actor_dcp: true
  # Never remove actor/dcp_checkpoint when that previous save was at these steps (e.g. [50] keeps global_step_50 after saving 75).
  prune_previous_actor_dcp_keep_steps: []

  resume_dir: null #"/data/users/kongyilun/code/rlinf-condition/logs/20260331-09:10:15-libero_10_grpo_openvlaoft_opt.yaml/libero_10_z_generator_sto_opt_512/checkpoints/global_step_25" # # Optional: path to a saved checkpoint directory, such as 'checkpoints/global_step_10'. If not None, it will be used to resume training.
  ckpt_path: null  # Optional: path to a .pt checkpoint. If not None, it will be loaded after the model is instantiated (for evaluation).

algorithm:
  use_optimizable_embedding: False
  # SigLIP 条件模型 rollout 时从 logits_c softmax 采样聚类；温度见 condition_model_sto.forward

  # REINFORCE on SigLIP condition policy (requires use_optimizable_embedding=True).
  # When enable_rl is false, behavior matches pre–condition-policy-RL runs.
  condition_policy:
    enable_rl: False
    cluster_only: True
    checkpoint_path: null # default: step3_encoder_training/siglip_condition_model_sto.pt
    cluster_sample_temperature: 2.0 # falls back to siglip_cluster_sample_temperature if omitted
    deterministic_cluster_train: false
    deterministic_residual_train: true
    deterministic_cluster_eval: true
    deterministic_residual_eval: true
    # REINFORCE: log_prob_cluster only; optimizer over siglip + classifier_head (lr below).
    baseline_momentum: 0.95
    update_interval_vla_steps: 5
    lr: 1.0e-6 # REINFORCE (siglip + classifier_head)
    weight_decay: 0.01
    grad_clip: 1.0
    micro_batch_size: 16
    # Full buffer passes + one optimizer step per micro-batch (not grad accumulation).
    reinforce_epochs: 1
    # REINFORCE advantage: global z-score (default) or per_task (within Libero task_id).
    reinforce_adv_mode: per_task # global | per_task
    reinforce_per_task_adv_standardize: true # if per_task: false => R - mean_task only
    # Cluster entropy bonus: minimize loss_pg - coef * mean(H(pi(.|s))).
    cluster_entropy_coef: 0.1
    # Rollout only: reproducible cluster/residual sampling in condition policy ``forward``.
    # Actor REINFORCE uses ``evaluate_log_prob`` (fixed rollout actions) — no policy resampling.
    sampling_seed: ${actor.seed}
    sampling_seed_add_rollout_rank: true
    # Optional: during REINFORCE, model.train() enables Dropout — fork RNG for reproducible masks.
    reinforce_train_seed: ${actor.seed}
    # GRPO backprop into cluster_embed + residual_head (separate optimizer), each train step.
    grpo_cm_start_step: 100
    grpo_cm_end_step: null # inclusive; null = no upper bound
    grpo_cm_lr: 1.0e-5
    grpo_cm_weight_decay: 0.01
    grpo_residual_l2_coef: 0.5
    grpo_cm_grad_clip: null

  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 2
  rollout_epoch: 2
  eval_rollout_epoch: 1 # set eval_rollout_epoch > 0 when enable runner.only_eval or runner.val_check_interval > 0

  reward_type: action_level  # action_level or chunk_level
  logprob_type: token_level
  entropy_type: token_level

  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  reward_coef: 5.0

  sampling_params:
    do_sample: True
    temperature_train: 1.6
    temperature_eval: 1.6
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0

  # length argument for autoregressive sampling
  # max length means max amount of tokens to generate
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

  filter_rewards: True
  rewards_lower_bound: 0.5
  rewards_upper_bound: 4.5

env:
  group_name: "EnvGroup"
  enable_offload: False

  # Override the default values in env/libero_10
  train:
    total_num_envs: 4
    group_size: ${algorithm.group_size}
    max_episode_steps: 512 # max episode steps for truncation
    max_steps_per_rollout_epoch: 512
    reward_coef: ${algorithm.reward_coef}
    use_ordered_reset_state_ids: True
    reset_gripper_open: False
  eval:
    total_num_envs: 500
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    group_size: 1
    use_fixed_reset_state_ids: True
    reset_gripper_open: False
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1
  

  model:
    model_path: "/data/users/kongyilun/code/RLinf/step2_warmup/openvla-oft-conditioned/runs/libero_10_condition_z_10--150000_chkpt"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 2
  global_batch_size: 4
  seed: 1234
  enable_offload: True

  # Override the default values in model/openvla_oft
  model:
    model_path: "/data/users/kongyilun/code/RLinf/step2_warmup/openvla-oft-conditioned/runs/libero_10_condition_z_10--150000_chkpt"
    model_type: "openvla_oft"
    unnorm_key: libero_10_no_noops
    max_prompt_length: 128

  optim:
    lr: 2.0e-5
    value_lr: 3.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-05
    weight_decay: 0.01
    clip_grad: 1.0

  # Override the default values in training_backend/fsdp
  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False